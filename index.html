<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framerile's Page</title>
    <style>
        /* Base page setup */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 1. This keeps your landing area exactly 100% of the screen height */
        .hero-section {
            height: 100vh; /* vh = viewport height. It locks it to the screen size. */
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* The structural layout inside the hero section */
        .page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px; 
            max-width: 1100px;
            padding: 40px;
        }

        /* Minimalist text styling */
        .text-side {
            text-align: left;
            max-width: 450px;
        }

        .text-side h1 {
            font-size: 56px; 
            font-weight: 700;
            letter-spacing: -0.015em;
            color: #1d1d1f; 
            margin: 0 0 12px 0;
        }

        .text-side p {
            font-size: 24px; 
            font-weight: 400;
            letter-spacing: -0.001em;
            color: #86868b; 
            margin: 0;
            line-height: 1.4;
        }

        /* Image sizing */
        .image-side img {
            display: block;
            width: 480px; 
            height: auto;
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06); 
        }

        /* 2. New styling for your future scrollable content area */
        .additional-content {
            padding: 80px 40px;
            max-width: 800px;
            margin: 0 auto;
            background-color: #f5f5f7; /* Apple's off-white background for contrast */
        }

        /* Mobile responsive behaviors */
        @media (max-width: 768px) {
            .hero-section {
                height: auto;
                min-height: 100vh; /* Allows section to expand if content is too large for mobile screens */
                padding: 60px 20px;
            }
            .page-container {
                flex-direction: column-reverse;
                text-align: center;
                gap: 40px;
            }
            .text-side {
                text-align: center;
            }
            .text-side h1 {
                font-size: 40px;
            }
            .text-side p {
                font-size: 20px;
            }
            .image-side img {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- This wrapper locks your top layout in place -->
    <section class="hero-section">
        <div class="page-container">
            <div class="text-side">
                <h1>Welcome!</h1>
                <p>My name is Christopher and this page is to show my projects.</p>
            </div>
            <div class="image-side">
                <img src="assets/image1.png" alt="Clean Minimalist Display">
            </div>
        </div>
    </section>

    <!-- 3. Add all your new scrollable content right here -->
    <section class="additional-content">
        <h2>More Content Here</h2>
        <p>As you scroll down, this area appears. Your top image and text section will remain completely unaffected above this point.</p>
    </section>

</body>
</html>
