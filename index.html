<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framerile's Page</title>
    <style>
        /* Base page setup */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        /* 1. This keeps your landing area exactly 100% of the screen height */
        .hero-section {
            height: 100vh; /* vh = viewport height. It locks it to the screen size. */
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* The structural layout inside the hero section */
        .page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px; 
            max-width: 1100px;
            padding: 40px;
        }

        /* Minimalist text styling */
        .text-side {
            text-align: left;
            max-width: 450px;
        }

        .text-side h1 {
            font-size: 56px; 
            font-weight: 700;
            letter-spacing: -0.015em;
            color: #1d1d1f; 
            margin: 0 0 12px 0;
        }

        .text-side p {
            font-size: 24px; 
            font-weight: 400;
            letter-spacing: -0.001em;
            color: #86868b; 
            margin: 0;
            line-height: 1.4;
        }

        /* Image sizing */
        .image-side img {
            display: block;
            width: 480px; 
            height: auto;
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06); 
        }

        /* --- New Interactive Projects Container --- */
        .interactive-section {
            padding: 100px 40px;
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        .interactive-section h2 {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            margin: 0 0 16px 0;
            letter-spacing: -0.01em;
        }

        .interactive-section p {
            font-size: 20px;
            color: #86868b;
            margin: 0 0 48px 0;
        }

        /* Container that sizes the media window frame display */
        .player-wrapper {
            position: relative;
            width: 800px; 
            height: 600px; 
            margin: 0 auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
            background-color: #000000;
        }

        /* Embedded web player styling */
        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Pure black screen backdrop cover mask */
        .black-screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* Minimalist circular blur play button */
        .play-button {
            width: 84px; 
            height: 84px; 
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Clean CSS geometric arrow icon vector */
        .play-arrow {
            width: 0;
            height: 0;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 24px solid #ffffff; 
            margin-left: 6px; 
        }

        /* Smooth premium scaling interactions on mouse hover */
        .black-screen-overlay:hover .play-button {
            transform: scale(1.08);
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .black-screen-overlay:active .play-button {
            transform: scale(0.96);
        }

        /* Core functional toggle class */
        .hidden-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Mobile responsive behaviors */
        @media (max-width: 768px) {
            .hero-section {
                height: auto;
                min-height: 100vh; 
                padding: 60px 20px;
            }
            .page-container {
                flex-direction: column-reverse;
                text-align: center;
                gap: 40px;
            }
            .text-side {
                text-align: center;
            }
            .text-side h1 {
                font-size: 40px;
            }
            .text-side p {
                font-size: 20px;
            }
            .image-side img {
                width: 100%;
                max-width: 400px;
            }
            .player-wrapper {
                width: 100%;
                height: 450px;
            }
        }
    </style>
</head>
<body>

    <!-- This wrapper locks your top layout in place -->
    <section class="hero-section">
        <div class="page-container">
            <div class="text-side">
                <h1>Welcome!</h1>
                <p>My name is Christopher and this page is to show my projects.</p>
            </div>
            <div class="image-side">
                <img src="assets/image1.png" alt="Clean Minimalist Display">
            </div>
        </div>
    </section>

    <!-- 2. Interactive Java Project Workspace Content Block -->
    <section class="interactive-section">
        <h2>Java Processing Project</h2>
        <p>Here are some of my projects from my AP CSA class. Press the play button to launch the live web execution application environment.</p>

        <div style="display:flex; gap:40px; justify-content:center; flex-wrap:wrap;">
        
            <div>
                <p style="text-align:center; font-weight:600; color:#1d1d1f;">Whack a Mole</p>
        
                <div class="player-wrapper">
                    <div class="black-screen-overlay" id="interactiveCover1" onclick="startAppExecution1()">
                        <div class="play-button">
                            <div class="play-arrow"></div>
                        </div>
                    </div>
        
                    <iframe id="pickcodeFrame1" src="about:blank" allow="autoplay"></iframe>
                </div>
            </div>
        
            <div>
                <p style="text-align:center; font-weight:600; color:#1d1d1f;">Game of Life</p>
        
                <div class="player-wrapper">
                    <div class="black-screen-overlay" id="interactiveCover2" onclick="startAppExecution2()">
                        <div class="play-button">
                            <div class="play-arrow"></div>
                        </div>
                    </div>
        
                    <iframe id="pickcodeFrame2" src="about:blank" allow="autoplay"></iframe>
                </div>
            </div>
        
            <div>
                <p style="text-align:center; font-weight:600; color:#1d1d1f;">Genurary 2026</p>
        
                <div class="player-wrapper">
                    <div class="black-screen-overlay" id="interactiveCover3" onclick="startAppExecution3()">
                        <div class="play-button">
                            <div class="play-arrow"></div>
                        </div>
                    </div>
        
                    <iframe id="pickcodeFrame3" src="about:blank" allow="autoplay"></iframe>
                </div>
            </div>
        
        </div>
    </section>

    <!-- Interactive script triggers execution safely -->
    <script>
    function startAppExecution1() {
        document.getElementById('interactiveCover1').classList.add('hidden-screen');
        document.getElementById('pickcodeFrame1').src =
            "https://app.pickcode.io/share/cmkbe2ipl01bw1hxrsn8aj9vk";
    }
    
    function startAppExecution2() {
        document.getElementById('interactiveCover2').classList.add('hidden-screen');
        document.getElementById('pickcodeFrame2').src =
            "https://app.pickcode.io/share/cmmkrex7k149i12z3d1vy8ube";
    }
    
    function startAppExecution3() {
        document.getElementById('interactiveCover3').classList.add('hidden-screen');
        document.getElementById('pickcodeFrame3').src =
            "https://app.pickcode.io/share/cmkq58v7u2i8srkwmcxbo9wio";
    }
    </script>

</body>
</html>
